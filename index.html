<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VORTEX | Curated Editorial</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400;600&display=swap');
        
        :root {
            --bg: #fcfcf9;
            --font-serif: 'Playfair Display', serif;
        }

        body { background: var(--bg); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }

        /* 解决跳动的关键：锁定标题高度 */
        .hero-title {
            font-family: var(--font-serif);
            font-size: clamp(2.2rem, 7vw, 5rem);
            line-height: 1.1;
            font-style: italic;
            min-height: 3.5em; 
        }

        #p-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem; padding: 0 1.5rem; max-width: 1400px; margin: 0 auto;
        }
        @media (min-width: 1024px) { #p-grid { grid-template-columns: repeat(3, 1fr); gap: 4rem; padding: 0 4rem; } }

        .product-card { opacity: 0; transform: translateY(30px); transition: all 1s ease; }
        .product-card.show { opacity: 1; transform: translateY(0); }

        .img-wrapper { position: relative; aspect-ratio: 4/5; overflow: hidden; background: #eee; cursor: pointer; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.5s ease; }
        .product-card:hover img { transform: scale(1.05); }

        #loading { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="loading"><div class="animate-pulse tracking-widest text-sm">VORTEX</div></div>

    <nav class="fixed top-0 w-full z-50 p-6 lg:px-12 flex justify-between items-center border-b border-black/[0.03] bg-white/50 backdrop-blur-md">
        <div class="font-bold tracking-widest text-sm uppercase">VORTEX</div>
    </nav>

    <main class="pt-40 pb-32">
        <section class="px-6 lg:px-12 mb-20 max-w-6xl">
            <h2 id="typed" class="hero-title tracking-tight"></h2>
        </section>
        <div id="p-grid"></div>
    </main>

    <script>
        const API_CONFIG = {
            TOKEN: "uskSHurHAYSbDQBvTya8V2X", // 你的 Token
            SHEET: "dstws9yu81bqKu8cvc"      // 你的 Sheet ID
        };

        async function init() {
            try {
                // 1. 获取数据
                const response = await fetch(`https://api.vika.cn/fusion/v1/datasheets/${API_CONFIG.SHEET}/records?viewId=viwf1vrvWHjzg`, {
                    headers: { 'Authorization': `Bearer ${API_CONFIG.TOKEN}` }
                });
                const res = await response.json();

                if (res.success) {
                    const grid = document.getElementById('p-grid');
                    // 2. 渲染列表
                    grid.innerHTML = res.data.records.map((item, i) => {
                        const f = item.fields;
                        
                        // 智能识别：图片列可能是附件数组，也可能是纯文本链接
                        let imgUrl = "";
                        if (f['图片']) {
                            imgUrl = Array.isArray(f['图片']) ? f['图片'][0].url : f['图片'];
                        }

                        if (!imgUrl) return ""; // 没图就不显示

                        const stagger = (window.innerWidth > 1024 && i % 3 === 1) ? 'margin-top: 5rem;' : '';
                        
                        return `
                            <div class="product-card" style="${stagger}">
                                <div class="img-wrapper" onclick="window.open('${f['链接'] || '#'}')">
                                    <img src="${imgUrl}" onload="this.closest('.product-card').classList.add('show')">
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (err) {
                console.error("读取失败:", err);
            } finally {
                // 3. 关闭加载动画 & 开启打字机
                document.getElementById('loading').style.display = 'none';
                new Typed('#typed', {
                    strings: ['Visual Narrative.', 'Curated from Vika API.', 'Silent Form.'],
                    typeSpeed: 50, backSpeed: 30, loop: true, showCursor: false
                });
            }
        }

        window.onload = init;
    </script>
</body>
</html>
