<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龙达 & VortinT 稳定管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
        .sidebar { background: #0f172a; }
        /* 状态颜色 1:1 还原维格表 */
        .status-待加工 { background: #f3e8ff; color: #9333ea; border: 1px solid #e9d5ff; }
        .status-组装中 { background: #dbeafe; color: #2563eb; border: 1px solid #bfdbfe; }
        .status-质检中 { background: #cffafe; color: #0891b2; border: 1px solid #a5f3fc; }
        .status-已完成 { background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
        .status-待处理 { background: #f8fafc; color: #64748b; border: 1px solid #e2e8f0; }
        .loading { cursor: not-allowed; opacity: 0.6; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900">
        <div class="bg-white p-10 rounded-[2rem] shadow-2xl w-full max-w-sm mx-4">
            <h2 class="text-2xl font-black text-slate-800 text-center mb-8">龙达系统管理</h2>
            <input type="password" id="loginPass" placeholder="请输入管理密码" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-100 outline-none text-center mb-4">
            <button onclick="handleLogin()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-lg hover:bg-indigo-700 transition-all">进入控制台</button>
        </div>
    </div>

    <div id="appBody" class="hidden flex w-full">
        <aside class="sidebar w-20 flex flex-col items-center py-8 space-y-10">
            <div class="text-indigo-500 font-black text-2xl italic">LD</div>
            <div class="flex-1">
                <div class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></div>
            </div>
            <button onclick="doLogout()" class="text-slate-500 hover:text-white transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7"/></svg></button>
        </aside>

        <div class="flex-1 flex flex-col min-w-0">
            <header class="h-20 bg-white border-b border-slate-200 px-8 flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-bold text-slate-800">流水线实时监控</h1>
                    <p class="text-xs text-green-500 font-bold">● 已连接至维格表数据库</p>
                </div>
                <button onclick="openForm()" class="bg-slate-900 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-black transition-all">+ 新增产品</button>
            </header>

            <main class="flex-1 overflow-auto p-8">
                <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 border-b">
                            <tr>
                                <th class="px-8 py-4 text-xs font-bold text-slate-400 uppercase">产品名称</th>
                                <th class="px-8 py-4 text-xs font-bold text-slate-400 uppercase">状态</th>
                                <th class="px-8 py-4 text-xs font-bold text-slate-400 uppercase">备注</th>
                                <th class="px-8 py-4 text-xs font-bold text-slate-400 text-right uppercase">操作</th>
                            </tr>
                        </thead>
                        <tbody id="listBody" class="divide-y divide-slate-50">
                            </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-[200] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] w-full max-w-md shadow-2xl p-8">
            <h3 id="modalTitle" class="text-xl font-bold mb-6">入库登记</h3>
            <form id="recordForm" class="space-y-5">
                <input type="hidden" id="recId">
                <div>
                    <label class="block text-xs font-black text-slate-400 mb-2">产品名称</label>
                    <input type="text" id="iptName" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-400 mb-2">当前状态</label>
                    <select id="iptStatus" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none cursor-pointer">
                        <option value="待处理">待处理</option>
                        <option value="待加工">待加工</option>
                        <option value="组装中">组装中</option>
                        <option value="质检中">质检中</option>
                        <option value="已完成">已完成</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-400 mb-2">备注</label>
                    <textarea id="iptRemark" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none"></textarea>
                </div>
                <div class="flex gap-4 pt-2">
                    <button type="button" onclick="closeForm()" class="flex-1 py-3 font-bold text-slate-400">取消</button>
                    <button type="submit" id="subBtn" class="flex-[2] py-3 bg-indigo-600 text-white rounded-xl font-bold">确认保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 【已填入你最新的凭证】
        const CONFIG = {
            TOKEN: "uskSHurHAYSbDQBvTya8V2X",
            SHEET_ID: "dst5PM6JE2lFUV2AWB",
            ADMIN_PWD: "longda" // 修改这里的密码为你想要的
        };

        let dataCache = [];

        // 【终极 API 函数】
        // 解决了 DELETE 报错、PATCH 404 等所有维格表 API 特有的坑
        async function vikaRequest(path, method = 'GET', body = null) {
            const url = `https://api.vika.cn/fusion/v1/datasheets/${CONFIG.SHEET_ID}/${path}`;
            const headers = { 'Authorization': `Bearer ${CONFIG.TOKEN}` };
            
            // 只有非 GET/DELETE 且有数据时才加 JSON 头
            if (method !== 'GET' && method !== 'DELETE' && body) {
                headers['Content-Type'] = 'application/json';
            }

            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);

            try {
                const res = await fetch(url, options);
                const json = await res.json();
                if (!json.success) {
                    alert("API 错误: " + json.message);
                    return null;
                }
                return json.data;
            } catch (e) {
                alert("网络连接失败，请检查网络或配置。");
                return null;
            }
        }

        async function reload() {
            const data = await vikaRequest('records?fieldKey=name');
            if (data) {
                dataCache = data.records;
                document.getElementById('listBody').innerHTML = dataCache.map(r => `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-8 py-5 font-bold text-slate-700">${r.fields['产品名称'] || '-'}</td>
                        <td class="px-8 py-5">
                            <span class="px-3 py-1 rounded-lg text-xs font-black status-${r.fields['当前状态'] || '待处理'}">
                                ${r.fields['当前状态'] || '待处理'}
                            </span>
                        </td>
                        <td class="px-8 py-5 text-slate-400 italic">${r.fields['管理员备注'] || '-'}</td>
                        <td class="px-8 py-5 text-right space-x-4">
                            <button onclick="openForm('${r.recordId}')" class="text-indigo-600 font-bold hover:underline">编辑</button>
                            <button onclick="doDelete('${r.recordId}')" class="text-red-400 hover:text-red-600 font-bold">删除</button>
                        </td>
                    </tr>
                `).join('');
            }
        }

        // 【删除修复】维格表删除不能把 ID 拼在 records/ 后面，必须用 recordIds 参数
        async function doDelete(id) {
            if (!confirm("确定删除吗？")) return;
            const res = await vikaRequest(`records?recordIds=${id}`, 'DELETE');
            if (res) reload();
        }

        window.openForm = (id = '') => {
            document.getElementById('recordForm').reset();
            document.getElementById('recId').value = id;
            document.getElementById('modalTitle').innerText = id ? '📝 编辑记录' : '✨ 新增入库';
            if (id) {
                const item = dataCache.find(r => r.recordId === id);
                document.getElementById('iptName').value = item.fields['产品名称'];
                document.getElementById('iptStatus').value = item.fields['当前状态'];
                document.getElementById('iptRemark').value = item.fields['管理员备注'] || '';
            }
            document.getElementById('modal').classList.remove('hidden');
        };

        window.closeForm = () => document.getElementById('modal').classList.add('hidden');

        document.getElementById('recordForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            const id = document.getElementById('recId').value;
            const fields = {
                "产品名称": document.getElementById('iptName').value,
                "当前状态": document.getElementById('iptStatus').value,
                "管理员备注": document.getElementById('iptRemark').value
            };

            btn.classList.add('loading');
            btn.innerText = "同步中...";

            // 【更新修复】维格表 PATCH 也不能在 URL 后面加 ID
            const payload = id 
                ? { records: [{ recordId: id, fields }], fieldKey: 'name' }
                : { records: [{ fields }], fieldKey: 'name' };
            
            const res = await vikaRequest('records', id ? 'PATCH' : 'POST', payload);
            
            btn.classList.remove('loading');
            btn.innerText = "确认保存";
            
            if (res) { closeForm(); reload(); }
        };

        function handleLogin() {
            if (document.getElementById('loginPass').value === CONFIG.ADMIN_PWD) {
                localStorage.setItem('LD_AUTH', 'OK');
                start();
            } else { alert("密码错误"); }
        }

        function doLogout() { localStorage.removeItem('LD_AUTH'); location.reload(); }

        function start() {
            if (localStorage.getItem('LD_AUTH')) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appBody').classList.remove('hidden');
                reload();
            }
        }
        start();
    </script>
</body>
</html>
